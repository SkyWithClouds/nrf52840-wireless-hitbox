name: WebHID Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
concurrency:
  group: webhid-site-source
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node source/tests/web_test.mjs
      - uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: published
      - name: Publish files to the configured Pages source
        run: |
          rsync -a --delete --exclude='/.git' --exclude='/.github' source/web-configurator/ published/
          cd published
          touch .nojekyll
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -f --ignore-unmatch .github/workflows/pages.yml
          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "Publish WebHID from $(git -C ../source rev-parse --short HEAD)"
            git push origin HEAD:gh-pages
          fi
      - name: Verify the published site against the tested source
        run: |
          url=$(gh api "repos/$GITHUB_REPOSITORY/pages" --jq '.html_url')
          for attempt in $(seq 1 60); do
            if python3 source/scripts/check_site.py "$url" source/web-configurator; then
              exit 0
            fi
            if [[ "$attempt" == 3 ]]; then
              gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" --silent || true
            fi
            sleep 8
          done
          exit 1
